name: Build APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.NORTEST_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nortest-release.jks"
            echo "NORTEST_KEYSTORE_FILE=$RUNNER_TEMP/nortest-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: building with the debug key"
          fi

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"; V="${V#v}"
          else
            V="1.0-dev.${{ github.run_number }}"
          fi
          echo "NORTEST_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "NORTEST_VERSION_CODE=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          NORTEST_KEYSTORE_PASSWORD: ${{ secrets.NORTEST_KEYSTORE_PASSWORD }}
          NORTEST_KEY_ALIAS: ${{ secrets.NORTEST_KEY_ALIAS }}
          NORTEST_KEY_PASSWORD: ${{ secrets.NORTEST_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Nortest.apk
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs Nortest.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: Nortest-apk
          path: |
            Nortest.apk
            app/build/reports/lint-results-release.html

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Nortest.apk --clobber --repo "${{ github.repository }}"
